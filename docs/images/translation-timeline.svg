<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" role="img" aria-label="One sentence over time: Opus-MT drafts, Qwen confirms the first clause, then finishes the sentence. Grey text may still change." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
  svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
  .box { fill: none; stroke: #8c959f; stroke-width: 1; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12px; }
  .ink { fill: #1f2328; }
  .faded { fill: #8c959f; }
  .rule { stroke: #d0d7de; stroke-width: 1; }
  .line { stroke: #8c959f; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
  .head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .box { stroke: #6e7681; }
    .t, .ink { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .faded { fill: #6e7681; }
    .rule { stroke: #30363d; }
    .line { stroke: #6e7681; }
    .head { fill: #6e7681; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs><text x="0" y="34" class="s" text-anchor="start">0.8 s</text><text x="64" y="34" style="font-size:14px"><tspan class="ink">The hardest</tspan><tspan class="faded"> part was</tspan></text><text x="64" y="62" style="font-size:18px;font-weight:600"><tspan class="faded">最难的部分</tspan></text><text x="900" y="34" class="s" text-anchor="end">Opus-MT draft</text><line class="rule" x1="0" y1="84" x2="900" y2="84"/><text x="0" y="112" class="s" text-anchor="start">1.6 s</text><text x="64" y="112" style="font-size:14px"><tspan class="ink">The hardest part was never</tspan><tspan class="faded"> the design,</tspan></text><text x="64" y="140" style="font-size:18px;font-weight:600"><tspan class="faded">最难的部分从来不是设计，</tspan></text><text x="900" y="112" class="s" text-anchor="end">newer draft replaces it</text><line class="rule" x1="0" y1="162" x2="900" y2="162"/><text x="0" y="190" class="s" text-anchor="start">2.4 s</text><text x="64" y="190" style="font-size:14px"><tspan class="ink">The hardest part was never the design, it was</tspan><tspan class="faded"> the fact</tspan></text><text x="64" y="218" style="font-size:18px;font-weight:600"><tspan class="ink">最难的部分从来不是设计，</tspan><tspan class="faded">而是</tspan></text><text x="900" y="190" class="s" text-anchor="end">Qwen confirms the first clause</text><line class="rule" x1="0" y1="240" x2="900" y2="240"/><text x="0" y="268" class="s" text-anchor="start">3.4 s</text><text x="64" y="268" style="font-size:14px"><tspan class="ink">The hardest part was never the design, it was the factory.</tspan></text><text x="64" y="296" style="font-size:18px;font-weight:600"><tspan class="ink">最难的部分从来不是设计，而是工厂。</tspan></text><text x="900" y="268" class="s" text-anchor="end">sentence ends, Qwen finishes</text></svg>
