[workspace]
resolver = "2"
members = [
    "crates/undertext-core",
    "crates/undertext-engines",
    "crates/undertext-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 4
